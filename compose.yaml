services:
  db:
    image: postgres:17
    container_name: postgres-db
    environment:
      POSTGRES_DB: gopher-social
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: adminpassword
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data

volumes:
  db-data: