basePath: /v1
definitions:
  main.CreatePostPayload:
    properties:
      content:
        maxLength: 1000
        type: string
      tags:
        items:
          type: string
        type: array
      title:
        maxLength: 100
        type: string
    required:
    - content
    - title
    type: object
  main.CreateUserTokenPayload:
    properties:
      email:
        maxLength: 100
        type: string
      password:
        maxLength: 100
        minLength: 8
        type: string
    required:
    - email
    - password
    type: object
  main.RegisterUserPayload:
    properties:
      email:
        maxLength: 100
        type: string
      password:
        maxLength: 100
        minLength: 8
        type: string
      username:
        maxLength: 100
        type: string
    required:
    - email
    - password
    - username
    type: object
  main.UpdatePostPayload:
    properties:
      content:
        maxLength: 1000
        type: string
      title:
        maxLength: 100
        type: string
    type: object
  models.CommentWithUser:
    properties:
      content:
        type: string
      created_at:
        type: string
      id:
        type: integer
      post_id:
        type: integer
      user:
        $ref: '#/definitions/models.User'
      user_id:
        type: integer
    type: object
  models.Post:
    properties:
      content:
        type: string
      created_at:
        type: string
      id:
        type: integer
      tags:
        items:
          type: string
        type: array
      title:
        type: string
      updated_at:
        type: string
      user_id:
        type: integer
      version:
        type: integer
    type: object
  models.PostWithComments:
    properties:
      comments:
        items:
          $ref: '#/definitions/models.CommentWithUser'
        type: array
      content:
        type: string
      created_at:
        type: string
      id:
        type: integer
      tags:
        items:
          type: string
        type: array
      title:
        type: string
      updated_at:
        type: string
      user:
        $ref: '#/definitions/models.User'
      user_id:
        type: integer
      version:
        type: integer
    type: object
  models.PostWithMetadata:
    properties:
      comments:
        items:
          $ref: '#/definitions/models.CommentWithUser'
        type: array
      comments_count:
        type: integer
      content:
        type: string
      created_at:
        type: string
      id:
        type: integer
      tags:
        items:
          type: string
        type: array
      title:
        type: string
      updated_at:
        type: string
      user:
        $ref: '#/definitions/models.User'
      user_id:
        type: integer
      version:
        type: integer
    type: object
  models.Role:
    properties:
      description:
        type: string
      id:
        type: integer
      level:
        type: integer
      name:
        type: string
    type: object
  models.User:
    properties:
      created_at:
        type: string
      email:
        type: string
      id:
        type: integer
      is_active:
        type: boolean
      role_id:
        type: integer
      username:
        type: string
    type: object
  models.UserWithRole:
    properties:
      created_at:
        type: string
      email:
        type: string
      id:
        type: integer
      is_active:
        type: boolean
      role:
        $ref: '#/definitions/models.Role'
      role_id:
        type: integer
      username:
        type: string
    type: object
  models.UserWithToken:
    properties:
      created_at:
        type: string
      email:
        type: string
      id:
        type: integer
      is_active:
        type: boolean
      role_id:
        type: integer
      token:
        type: string
      username:
        type: string
    type: object
info:
  contact:
    email: support@swagger.io
    name: API Support
    url: http://www.swagger.io/support
  description: API for GopherSocial, a social media network for Gophers.
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  termsOfService: http://swagger.io/terms/
  title: GopherSocial API
paths:
  /authentication/token:
    post:
      consumes:
      - application/json
      description: Creates a new token for a user based on their username and password.
      parameters:
      - description: User credentials payload
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/main.CreateUserTokenPayload'
      produces:
      - application/json
      responses:
        "200":
          description: Token created successfully
          schema:
            type: string
        "400":
          description: Invalid or missing username/password, or malformed JSON
          schema: {}
        "401":
          description: Invalid username or password
          schema: {}
        "500":
          description: Failed to create token
          schema: {}
      summary: Create a new token for a user
      tags:
      - authentication
  /authentication/user:
    post:
      consumes:
      - application/json
      description: Creates a new user account.
      parameters:
      - description: User registration payload
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/main.RegisterUserPayload'
      produces:
      - application/json
      responses:
        "201":
          description: User registered successfully
          schema:
            $ref: '#/definitions/models.UserWithToken'
        "400":
          description: Invalid or missing username/email/password, or malformed JSON
          schema: {}
        "409":
          description: Username or email already exists
          schema: {}
        "500":
          description: Failed to register the user
          schema: {}
      summary: Register a new user
      tags:
      - authentication
  /health:
    get:
      description: Returns the API status, environment and version.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Failed to write the response
          schema: {}
      security:
      - ApiKeyAuth: []
      summary: Health check
      tags:
      - ops
  /posts:
    post:
      consumes:
      - application/json
      description: Creates a new post.
      parameters:
      - description: Post payload
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/main.CreatePostPayload'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/models.Post'
        "400":
          description: Invalid or missing title/content, or malformed JSON
          schema: {}
        "500":
          description: Failed to create the post
          schema: {}
      security:
      - ApiKeyAuth: []
      summary: Creates a post
      tags:
      - posts
  /posts/{postID}:
    delete:
      consumes:
      - application/json
      description: Deletes a post by ID.
      parameters:
      - description: Post ID
        in: path
        name: postID
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "204":
          description: Post deleted
        "400":
          description: Invalid post ID
          schema: {}
        "404":
          description: Post not found
          schema: {}
        "500":
          description: Failed to delete the post
          schema: {}
      security:
      - ApiKeyAuth: []
      summary: Deletes a post
      tags:
      - posts
    get:
      consumes:
      - application/json
      description: Fetches a post by ID, including its comments.
      parameters:
      - description: Post ID
        in: path
        name: postID
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.PostWithComments'
        "400":
          description: Invalid post ID
          schema: {}
        "404":
          description: Post not found
          schema: {}
        "500":
          description: Failed to fetch the post or its comments
          schema: {}
      security:
      - ApiKeyAuth: []
      summary: Fetches a post
      tags:
      - posts
    patch:
      consumes:
      - application/json
      description: Updates the title and/or content of a post.
      parameters:
      - description: Post ID
        in: path
        name: postID
        required: true
        type: integer
      - description: Post payload
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/main.UpdatePostPayload'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.Post'
        "400":
          description: Invalid post ID, malformed JSON or invalid title/content
          schema: {}
        "404":
          description: Post not found
          schema: {}
        "409":
          description: Post was modified by someone else (version conflict)
          schema: {}
        "500":
          description: Failed to update the post
          schema: {}
      security:
      - ApiKeyAuth: []
      summary: Updates a post
      tags:
      - posts
  /users/{userID}:
    get:
      consumes:
      - application/json
      description: Fetches a user profile by ID.
      parameters:
      - description: User ID
        in: path
        name: userID
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.UserWithRole'
        "400":
          description: Invalid user ID
          schema: {}
        "404":
          description: User not found
          schema: {}
        "500":
          description: Failed to fetch the user
          schema: {}
      security:
      - ApiKeyAuth: []
      summary: Fetches a user by ID
      tags:
      - users
  /users/{userID}/follow:
    put:
      consumes:
      - application/json
      description: Makes the given follower follow the user identified by the path
        ID.
      parameters:
      - description: ID of the user to follow
        in: path
        name: userID
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "204":
          description: User followed
        "400":
          description: Invalid user ID or malformed JSON
          schema: {}
        "404":
          description: User not found
          schema: {}
        "409":
          description: Already following
          schema: {}
        "500":
          description: Failed to follow the user
          schema: {}
      security:
      - ApiKeyAuth: []
      summary: Follows a user
      tags:
      - users
  /users/{userID}/unfollow:
    put:
      consumes:
      - application/json
      description: Makes the given follower unfollow the user identified by the path
        ID.
      parameters:
      - description: ID of the user to unfollow
        in: path
        name: userID
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "204":
          description: User unfollowed
        "400":
          description: Invalid user ID or malformed JSON
          schema: {}
        "404":
          description: User not found
          schema: {}
        "500":
          description: Failed to unfollow the user
          schema: {}
      security:
      - ApiKeyAuth: []
      summary: Unfollows a user
      tags:
      - users
  /users/activate/{token}:
    put:
      description: Activates a user account using the provided activation token.
      parameters:
      - description: Activation token
        in: path
        name: token
        required: true
        type: string
      produces:
      - application/json
      responses:
        "204":
          description: User account activated successfully
          schema:
            type: string
        "404":
          description: Not Found
          schema: {}
        "500":
          description: Internal Server Error
          schema: {}
      summary: Activates/Registers a user account
      tags:
      - users
  /users/feed:
    get:
      consumes:
      - application/json
      description: Fetches the posts of the user and the users they follow, with pagination,
        sorting and filtering.
      parameters:
      - default: 20
        description: Page size (1-20)
        in: query
        name: limit
        type: integer
      - default: 0
        description: Offset
        in: query
        name: offset
        type: integer
      - default: desc
        description: Sort by created_at
        enum:
        - asc
        - desc
        in: query
        name: sort
        type: string
      - description: Comma-separated tags (max 5)
        in: query
        name: tags
        type: string
      - description: Search in title and content (max 100 chars)
        in: query
        name: search
        type: string
      - description: Created since (RFC3339)
        in: query
        name: since
        type: string
      - description: Created until (RFC3339)
        in: query
        name: until
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              items:
                $ref: '#/definitions/models.PostWithMetadata'
              type: array
            type: array
        "400":
          description: Invalid query params (bad limit, offset, sort, tags, search
            or date)
          schema: {}
        "500":
          description: Failed to fetch the feed
          schema: {}
      security:
      - ApiKeyAuth: []
      summary: Fetches the user feed
      tags:
      - feed
securityDefinitions:
  ApiKeyAuth:
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
